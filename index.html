  <style>

    .login-box, .dashboard {
      max-width: 500px;
      width: 100%;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    h2, h3 { text-align: center; }

    }

      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0390fc;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover { background: #0260a8; }
    
    .table-container {
      overflow-x: auto;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      min-width: 400px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background: #fccaa4;
    }
    .th-cuti {
      background: #a4d4fc; /* Warna berbeda untuk header cuti */
    }
    tfoot td {
      font-weight: bold;
      background: #eef;
    }
  </style>

    // Populate dropdown
    const usernameSelect = document.getElementById("username");
    users.forEach(u => {
      const option = document.createElement("option");
      option.value = u.username;
      option.textContent = u.username;
      usernameSelect.appendChild(option);
    });

    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (!username) {
        document.getElementById("errorMsg").textContent = "Silakan pilih username dulu!";
        return;
      }

      const user = users.find(u => u.username === username && u.password === password);

      if (user) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        
        document.getElementById("welcome").textContent = user.username;
        document.getElementById("infoCuti").innerHTML = `Sisa Cuti: ${user.sisaCuti} Hari <br><span style="font-size: 14px; font-weight: normal; color: #555;">Berlaku s/d: ${user.berlaku}</span>`;

        // === Render Data Cuti (Logika Baru) ===
        const userCuti = cutiData.filter(c => c.nama === user.username);
        const cutiTbody = document.querySelector("#cutiTable tbody");
        cutiTbody.innerHTML = "";

        if (userCuti.length > 0) {
          userCuti.forEach(c => {
            cutiTbody.innerHTML += `<tr><td>${c.cutitanggal}</td></tr>`;
          });
        } else {
          cutiTbody.innerHTML = `<tr><td style="color: #999;">Tidak ada riwayat cuti</td></tr>`;
        }

        // === Render Data Lembur ===
        const userData = lemburData.filter(d => d.nama === user.username);
        const lemburTbody = document.querySelector("#lemburTable tbody");
        lemburTbody.innerHTML = "";

        let total = 0;
        userData.forEach(d => {
          const row = `<tr>
                        <td>${d.tanggal}</td>
                        <td>${d.FromTo}</td>
                        <td>${d.act}</td>
                        <td>${d.index}</td>
                      </tr>`;
          lemburTbody.innerHTML += row;
          total += d.index;
        });

        document.getElementById("totalIndex").textContent = total.toFixed(2);

      } else {
        document.getElementById("errorMsg").textContent = "Username atau Password salah!";
      }
    }

    function logout() {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      
      // Reset semua field
      document.getElementById("password").value = "";
      document.getElementById("errorMsg").textContent = "";
      document.getElementById("username").value = "";
      document.getElementById("infoCuti").textContent = "";
      document.querySelector("#cutiTable tbody").innerHTML = ""; // Reset tabel cuti
      document.querySelector("#lemburTable tbody").innerHTML = "";
      document.getElementById("totalIndex").textContent = "0";
    }
